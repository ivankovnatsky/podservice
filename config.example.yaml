# Pod Service Configuration

server:
  # Port to listen on
  port: 8083

  # Host to bind to (0.0.0.0 for all interfaces)
  host: "192.168.50.7"

  # Base URL for the service (used in podcast feed URLs)
  # Use your machine's local IP address so phones/other devices can access it
  base_url: "http://192.168.50.7:8083"

podcast:
  # Podcast metadata
  title: "My Podcast"
  description: "Audio podcast episodes"
  author: "PodService"
  language: "en-us"
  category: "Technology"

  # Optional: URL to podcast cover image
  image_url: null

storage:
  # Base data directory (relative to project root)
  data_dir: "./data"

  # Audio files directory (defaults to data_dir/audio if not set)
  audio_dir: "./data/audio"

  # Metadata directory (defaults to data_dir/metadata if not set)
  # metadata_dir: "./data/metadata"

  # Thumbnails directory (defaults to data_dir/thumbnails if not set)
  # thumbnails_dir: "./data/thumbnails"

rabbitmq:
  # RabbitMQ connection and durable download-job routing
  host: "127.0.0.1"
  port: 5672
  management_port: 15672
  username: "guest"
  password_file: null
  virtual_host: "/"
  exchange: "podservice.commands"
  queue: "podservice.downloads"
  routing_key: "download.requested"

  # Delay failed downloads for 30 seconds, 5 minutes, then 30 minutes
  retry_delays: [30, 300, 1800]
  reconnect_delay: 5

kafka:
  # Publish download lifecycle events and project them into the status dashboard
  enabled: false
  bootstrap_servers: ["127.0.0.1:9092"]
  topic: "podservice.lifecycle"
  consumer_group: "podservice-dashboard"
  client_id: "podservice"
  topic_partitions: 1
  topic_replication_factor: 1
  reconnect_delay: 5

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"
